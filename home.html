<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dad Dashboard — Home</title>
  <style>
    body {
      background-color: #111;
      color: #eee;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 2rem;
    }

    h1 {
      margin-bottom: 0.5rem;
    }

    .section {
      margin: 2rem auto;
      max-width: 600px;
      background: #222;
      padding: 1rem;
      border-radius: 10px;
      box-shadow: 0 0 10px #0f0;
    }

    button {
      margin: 0.5rem;
      font-size: 1rem;
      padding: 8px 16px;
      cursor: pointer;
      border: none;
      border-radius: 5px;
      background-color: limegreen;
      color: black;
    }

    button:hover {
      background-color: #00c000;
    }

    footer {
      margin-top: 2rem;
      font-size: 0.85rem;
      color: #888;
    }

    footer a {
      color: limegreen;
    }
  </style>
</head>
<body>

  <h1>Welcome</h1>

  <div class="section">
    <p>Welcome to the Dad Dashboard — your one-stop spot for the time, the weather, and the news.</p>
    <button onclick="location.href='index.html'">Go to dashboard</button>
  </div>

  <footer>
    Forked/Continued by the one and only
    <a href="https://ngiotsas.github.io" target="_blank" rel="noopener noreferrer">ngiotsas</a>.
    OG by <a href="https://github.com/Baller300000/dad-site" target="_blank" rel="noopener noreferrer">Baller300000</a>.
  </footer>

</body>
</html>
